name: Desktop trial build

# Builds unsigned trial versions of Illuminated Life for Mac and Windows.
# Runs only for the desktop-app branch, or when started by hand.
on:
  push:
    branches: [desktop-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin --bundles dmg
            out: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: --bundles nsis
            out: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Copy the web app into desktop/dist
        shell: bash
        run: |
          mkdir -p desktop/dist
          git archive HEAD -- . ':(exclude)desktop' ':(exclude).github' ':(exclude)tools' ':(exclude)docs' | tar -x -C desktop/dist
          ls desktop/dist
      - name: Build
        shell: bash
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: illuminated-life-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
